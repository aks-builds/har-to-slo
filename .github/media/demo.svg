<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
      .c-comment { fill: #6272a4; }
      .c-keyword { fill: #ff79c6; }
      .c-string  { fill: #f1fa8c; }
      .c-key     { fill: #8be9fd; }
      .c-num     { fill: #bd93f9; }
      .c-plain   { fill: #f8f8f2; }
      .c-dim     { fill: #6272a4; }
      .c-url     { fill: #50fa7b; }
      .prompt    { fill: #50fa7b; }
    </style>
  </defs>

  <!-- Outer frame with shadow -->
  <rect x="16" y="16" width="788" height="488" rx="10" fill="#21222c" filter="url(#shadow)"/>

  <!-- Window chrome bar -->
  <rect x="16" y="16" width="788" height="36" rx="10" fill="#282a36"/>
  <rect x="16" y="36" width="788" height="16" fill="#282a36"/>

  <!-- Traffic-light dots -->
  <circle cx="44" cy="34" r="7" fill="#ff5f57"/>
  <circle cx="68" cy="34" r="7" fill="#ffbd2e"/>
  <circle cx="92" cy="34" r="7" fill="#28c840"/>

  <!-- Window title -->
  <text x="410" y="39" text-anchor="middle" class="mono c-dim" font-size="12">har-to-k6-thresholds</text>

  <!-- Terminal body -->
  <rect x="16" y="52" width="788" height="452" rx="0" fill="#21222c"/>
  <rect x="16" y="484" width="788" height="20" rx="10" fill="#21222c"/>
  <rect x="16" y="464" width="788" height="40" rx="0" fill="#21222c"/>
  <rect x="16" y="464" width="788" height="40" rx="10" fill="#21222c"/>

  <!-- Prompt line -->
  <text x="36" y="86" class="mono" font-size="13">
    <tspan class="prompt">$ </tspan><tspan class="c-plain">node src/cli.js --input tests/fixtures/medium.har</tspan>
  </text>

  <!-- Output line 1: comment -->
  <text x="36" y="112" class="mono c-comment" font-size="13">// Auto-generated by har-to-k6-thresholds</text>
  <!-- Output line 2: url comment -->
  <text x="36" y="132" class="mono c-url" font-size="13">// https://github.com/aks-builds/har-to-k6-thresholds</text>

  <!-- blank line -->
  <!-- export const options = { -->
  <text x="36" y="160" class="mono" font-size="13">
    <tspan class="c-keyword">export const </tspan><tspan class="c-plain">options = {</tspan>
  </text>
  <text x="36" y="180" class="mono c-plain" font-size="13">  thresholds: {</text>

  <!-- Route 1 -->
  <text x="36" y="204" class="mono c-comment" font-size="13">    // GET /api/v1/users/{id} — p95 baseline: 142ms (n=8, ×1.5)</text>
  <text x="36" y="222" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:GET_/api/v1/users/_id_}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;213"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Route 2 -->
  <text x="36" y="244" class="mono c-comment" font-size="13">    // GET /api/v1/products — p95 baseline: 250ms (n=8, ×1.5)</text>
  <text x="36" y="262" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:GET_/api/v1/products}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;375"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Route 3 -->
  <text x="36" y="284" class="mono c-comment" font-size="13">    // POST /api/v1/orders — p95 baseline: 610ms (n=8, ×1.5)</text>
  <text x="36" y="302" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:POST_/api/v1/orders}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;915"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Route 4 -->
  <text x="36" y="324" class="mono c-comment" font-size="13">    // GET /api/v1/orders/{id} — p95 baseline: 160ms (n=8, ×1.5)</text>
  <text x="36" y="342" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:GET_/api/v1/orders/_id_}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;240"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Route 5 -->
  <text x="36" y="364" class="mono c-comment" font-size="13">    // PUT /api/v1/users/{id} — p95 baseline: 320ms (n=8, ×1.5)</text>
  <text x="36" y="382" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:PUT_/api/v1/users/_id_}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;480"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Route 6 -->
  <text x="36" y="404" class="mono c-comment" font-size="13">    // DELETE /api/v1/products/{id} — p95 baseline: 210ms (n=8, ×1.5)</text>
  <text x="36" y="422" class="mono" font-size="13">
    <tspan class="c-plain">    </tspan><tspan class="c-string">"http_req_duration{scenario:DELETE_/api/v1/products/_id_}"</tspan><tspan class="c-plain">: [</tspan><tspan class="c-string">"p(95)&lt;315"</tspan><tspan class="c-plain">],</tspan>
  </text>

  <!-- Closing braces -->
  <text x="36" y="448" class="mono c-plain" font-size="13">  },</text>
  <text x="36" y="468" class="mono c-plain" font-size="13">};</text>

  <!-- Cursor blink -->
  <rect x="36" y="474" width="8" height="14" fill="#f8f8f2" opacity="0.7"/>
</svg>
