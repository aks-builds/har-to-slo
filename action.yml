name: har-to-slo
description: Derive k6 SLO thresholds from a HAR file and optionally post them as a PR comment
author: aks-builds

inputs:
  har-path:
    description: Path to the HAR file
    required: true
  multiplier:
    description: Threshold multiplier applied to p95 (default 1.5)
    required: false
    default: '1.5'
  post-pr-comment:
    description: Post threshold recommendations as a PR comment
    required: false
    default: 'false'

outputs:
  thresholds-json:
    description: JSON representation of computed thresholds
    value: ${{ steps.compute.outputs.thresholds }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Compute thresholds
      id: compute
      shell: bash
      run: |
        OUTPUT=$(npx har-to-slo@latest --input "${{ inputs.har-path }}" --multiplier ${{ inputs.multiplier }} --format json)
        echo "thresholds<<EOF" >> $GITHUB_OUTPUT
        echo "$OUTPUT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Post PR comment
      if: inputs.post-pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const thresholds = ${{ steps.compute.outputs.thresholds }};
          const body = [
            '## k6 Threshold Recommendations',
            '> Generated by `har-to-slo` from HAR file timing data',
            '',
            '```javascript',
            JSON.stringify(thresholds, null, 2),
            '```',
          ].join('\n');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body,
          });
